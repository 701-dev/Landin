#  Do the links still answer?
#
#  check.py holds the two properties it can hold without a network: a
#  repository-relative name a document uses resolves, and every document is
#  reachable from README.md.  Neither says whether a URL is still there.
#
#  Check changed documents on a push, and all documents once a week because
#  link rot happens on the far side of the link and no commit here announces it.
#  It is not a gate on the compiler.

name: links

on:
  push:
    paths:
      - '**.md'
      - 'lychee.toml'
      - '.github/workflows/links.yml'
      - 'scripts/links_inputs.py'
  schedule:
    #  Mondays, early UTC.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select documents
        id: inputs
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/links_inputs.py

      #  The flake's lychee, at the version environments/pins.sh pins, from
      #  the nix-packages cache.
      - name: Install lychee
        if: steps.inputs.outputs.scope != 'none'
        uses: ./.github/actions/nix-tools
        with:
          packages: lychee

      - name: Check links
        if: steps.inputs.outputs.scope != 'none'
        run: >-
          lychee --config lychee.toml --no-progress
          --files-from "$RUNNER_TEMP/lychee-inputs.txt"
