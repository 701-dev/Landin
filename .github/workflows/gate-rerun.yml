#  One automatic re-run of a branch push's gate run when every job that
#  failed in it failed by an outside signature `.github/gate-lanes.json`
#  records and a second attempt can pass: a mirror's 403, a runner's full
#  disk.  The run's summary here names the run and the signatures, and the
#  re-run's aggregate names the attempt.  Main's gate is investigated, never
#  re-run blindly; a run already re-run, one whose branch has moved on, a
#  dispatch and the schedule are left alone (docs/process.md,
#  "Failure causes and the selection in shadow").  GitHub runs the default
#  branch's copy of this workflow, so a change to it takes effect on main.

name: gate-rerun

on:
  workflow_run:
    workflows: [gate]
    types: [completed]

permissions:
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch != 'main'
      && github.event.workflow_run.run_attempt == 1
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Re-run the failed jobs once if every one failed outside the change
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: python3 scripts/gate_history.py rerun "$RUN"
